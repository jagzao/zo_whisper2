name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome rather than prescribing an unnecessary architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / constraints
      description: Local-first, privacy, portability, performance or compatibility constraints that matter.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include real recordings, transcripts, credentials or private client data.
          required: true
