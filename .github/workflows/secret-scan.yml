name: Secret Scan

# Deliberately unconditional — no `paths:` filter. dashboard-ci.yml's
# shared trigger filter excludes docs/**, watcher/**, deepseek/**, so a
# doc-only change (exactly the kind of change most likely to introduce or
# re-expose a leaked string) would never have run gitleaks at all if it
# stayed bundled into that workflow. This one always runs.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
