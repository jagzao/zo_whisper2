name: Whisper Dashboard CI

on:
  push:
    paths:
      - 'src/transcript_pipeline/dashboard/**'
      - 'dashboard.py'
      - 'tests/e2e/**'
  pull_request:
    paths:
      - 'src/transcript_pipeline/dashboard/**'
      - 'dashboard.py'
      - 'tests/e2e/**'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install playwright
          playwright install chromium
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Ensure folders exist
        run: |
          python -c "from pathlib import Path; [Path(d).mkdir(parents=True, exist_ok=True) for d in ['Video_compress','Videos','audio','CarpetaTranscripciones']]"

      - name: Start dashboard and run E2E tests
        run: |
          $env:PYTHONPATH = "$pwd\src"
          $job = Start-Job { python dashboard.py }
          Start-Sleep -Seconds 5
          python tests/e2e/smoke_dashboard.py
          Remove-Job $job -Force

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: dashboard_*.png
