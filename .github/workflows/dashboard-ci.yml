name: Whisper Dashboard CI

on:
  push:
    paths:
      - 'src/transcript_pipeline/**'
      - 'dashboard.py'
      - 'master_processor.py'
      - 'simple_scan.py'
      - 'compress_and_move.py'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.lock.txt'
      - '.gitleaks.toml'
      - '.github/**'
  pull_request:
    paths:
      - 'src/transcript_pipeline/**'
      - 'dashboard.py'
      - 'master_processor.py'
      - 'simple_scan.py'
      - 'compress_and_move.py'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements.lock.txt'
      - '.gitleaks.toml'
      - '.github/**'
  workflow_dispatch:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Quality harness
        run: python scripts/quality.py
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: quality_report.json

  security:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Security harness
        run: python scripts/security.py
      - name: Generate SBOM (CycloneDX)
        if: always()
        run: python -m pip_audit --format cyclonedx-json -o sbom.json
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: |
            security_report.json
            sbom.json

  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          # choco's PATH update doesn't reliably propagate to this job's
          # later steps on windows-latest runners — GITHUB_PATH is the
          # mechanism GitHub Actions documents for making a step's tool
          # installs visible to subsequent steps.
          $ffmpegDir = Split-Path (Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\ffmpeg*' -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if ($ffmpegDir) { Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir }
        shell: pwsh
      - name: Smoke harness
        run: python scripts/smoke.py
      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: smoke_report.json

  unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          # choco's PATH update doesn't reliably propagate to this job's
          # later steps on windows-latest runners — GITHUB_PATH is the
          # mechanism GitHub Actions documents for making a step's tool
          # installs visible to subsequent steps.
          $ffmpegDir = Split-Path (Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\ffmpeg*' -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if ($ffmpegDir) { Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir }
        shell: pwsh
      - name: Install Tesseract
        run: |
          choco install tesseract -y --no-progress
          # choco's PATH update doesn't reliably propagate to this job's
          # later steps on windows-latest runners — GITHUB_PATH is the
          # mechanism GitHub Actions documents for making a step's tool
          # installs visible to subsequent steps.
          $tesseractDir = Split-Path (Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\tesseract*' -Filter tesseract.exe -Recurse | Select-Object -First 1).FullName
          if ($tesseractDir) { Add-Content -Path $env:GITHUB_PATH -Value $tesseractDir }
        shell: pwsh
      - name: Unit test harness
        run: python scripts/ut.py
      - name: Upload UT report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ut-report-py${{ matrix.python-version }}
          path: ut_report.json

  e2e:
    runs-on: windows-latest
    needs: [quality, security, smoke, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install chromium
        env:
          PIP_NO_CACHE_DIR: 1
      - name: Install FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          # choco's PATH update doesn't reliably propagate to this job's
          # later steps on windows-latest runners — GITHUB_PATH is the
          # mechanism GitHub Actions documents for making a step's tool
          # installs visible to subsequent steps.
          $ffmpegDir = Split-Path (Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\ffmpeg*' -Filter ffmpeg.exe -Recurse | Select-Object -First 1).FullName
          if ($ffmpegDir) { Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir }
        shell: pwsh
      - name: Ensure folders exist
        run: |
          python -c "from pathlib import Path; [Path(d).mkdir(parents=True, exist_ok=True) for d in ['Video_compress','Videos','audio','CarpetaTranscripciones']]"
      - name: Generate mock data (synthetic files, no real client data)
        run: |
          echo '{}' > processed_files.json
          copy projects.json.example projects.json
          python docs\assets\generate_mock_data.py
      - name: E2E harness
        run: python scripts/e2e.py
      - name: Upload E2E report and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            e2e_report.json
            dashboard_*.png
            dashboard_report.json
