name: Whisper Dashboard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python scripts/gate_runner.py quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-gate
          path: artifacts/gates/**
          if-no-files-found: ignore

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: python scripts/gate_runner.py security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gate
          path: artifacts/gates/**
          if-no-files-found: ignore

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: python scripts/gate_runner.py pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-gate
          path: artifacts/gates/**
          if-no-files-found: ignore

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: python scripts/gate_runner.py smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-gate
          path: artifacts/gates/**
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python docs/assets/generate_mock_data.py
      - run: python scripts/gate_runner.py e2e
      - run: python docs/assets/cleanup_mock_data.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-gate
          path: artifacts/gates/**
          if-no-files-found: ignore

  fresh-install:
    name: fresh-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: python scripts/fresh_install_acceptance.py
