[project]
name = "transcript-pipeline"
version = "1.0.0"
description = "Local audio/video transcription pipeline (faster-whisper, CPU int8) with declarative per-project routing and keyframe extraction for tutorials/meetings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "certifi>=2024.1.0",
]

[project.optional-dependencies]
# Meeting summaries / tutorial frame descriptions via a remote or local
# OpenAI-compatible endpoint (see PRIVACY.md — off by default either way).
llm = [
    "openai>=1.0.0",
]
# Screen-content-change detection for meeting_dev_handler: OCR (Tesseract)
# or perceptual-hash fallback. Needed alongside `llm` for
# FRAME_DESCRIPTIONS=true / tutorial frame descriptions.
vision = [
    "pytesseract>=0.3.10",
    "imagehash>=4.3.1",
]
# MarkItDown document scanning (meeting_dev_handler's PDF/Word/Excel/image
# attachment summaries). Still `[all]` at this pin — markitdown only split
# its dependencies into narrower extras (pdf/docx/xlsx/...) starting at
# 0.1.0, which also changed the MarkItDown() constructor signature used by
# meeting_dev_handler.py's llm_client/llm_model wiring. Bumping the pin to
# get the narrower extra would be a behavior-risking upgrade, not a pure
# dependency-scoping change — out of scope here. `[all]` still moving out
# of core dependencies is the actual win: a plain `pip install .` no
# longer drags in Azure SDKs at all unless this extra is requested.
documents = [
    "markitdown[all]>=0.0.1",
]
all = [
    "transcript-pipeline[llm,vision,documents]",
]
dev = [
    "transcript-pipeline[all]",
    "pytest>=8.0.0",
    "playwright>=1.40.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "pip-audit>=2.7.0",
]

[project.scripts]
transcript-run = "transcript_pipeline.cli:run"
transcript-scan = "transcript_pipeline.cli:scan"
transcript-compress = "transcript_pipeline.cli:compress"
transcript-dashboard = "transcript_pipeline.cli:dashboard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["watcher", "deepseek"]

[tool.ruff.lint]
# Kept intentionally small: unused imports/vars and import order catch real
# bugs; a stricter ruleset on an existing codebase mostly produces cosmetic
# churn without proportional value.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line-length handled by `line-length`, not worth hard-failing on strings/URLs

[tool.pyright]
include = ["src/transcript_pipeline"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = true
# Third-party ML/media deps often ship no or partial type stubs;
# don't fail the gate over that specifically.
reportMissingTypeStubs = false
